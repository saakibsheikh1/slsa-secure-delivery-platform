name: Secure Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build, Scan, Sign, and Publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: ./services/api
          - service: worker
            context: ./services/worker
          - service: frontend
            context: ./services/frontend

    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/slsa-secure-delivery-${{ matrix.service }}:${{ github.ref_type == 'tag' && github.ref_name || github.sha }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/slsa-secure-delivery-${{ matrix.service }}:${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.spdx.json
          artifact-name: release-sbom-${{ matrix.service }}
          upload-artifact: true

      - name: Sign image with Cosign keyless signing
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/slsa-secure-delivery-${{ matrix.service }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attach SBOM attestation to image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/slsa-secure-delivery-${{ matrix.service }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign attest \
            --yes \
            --type spdxjson \
            --predicate "sbom-${{ matrix.service }}.spdx.json" \
            "${IMAGE}@${DIGEST}"

      - name: Attest image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/slsa-secure-delivery-${{ matrix.service }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
