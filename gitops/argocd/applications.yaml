apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: slsa-platform-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/saakibsheikh1/slsa-secure-delivery-platform.git
    targetRevision: main
    path: kubernetes/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: slsa-app-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: slsa-platform-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/saakibsheikh1/slsa-secure-delivery-platform.git
    targetRevision: main
    path: kubernetes/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: slsa-app-prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
