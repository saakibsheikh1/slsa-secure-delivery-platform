apiVersion: v1
kind: Namespace
metadata:
  name: slsa-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: slsa-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/saakibsheikh1/slsa-secure-delivery-api@sha256:7b6503c31cf8ee07beb2c6ea2d0956cd6db3fb9963e98bf002718612093b8ba2
          ports:
            - containerPort: 5000
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: slsa-app
spec:
  selector:
    app: api
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: slsa-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/saakibsheikh1/slsa-secure-delivery-worker@sha256:dbb93b71aa1e669b1482c27691297b926e68b823b30dbfd07df543115061965b
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: slsa-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/saakibsheikh1/slsa-secure-delivery-frontend@sha256:578b08f630d92021010d24d212b7b508b5ccc6b3ba30c065c3501773bd7645ed
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: slsa-app
spec:
  selector:
    app: frontend
  ports:
    - port: 8080
      targetPort: 8080