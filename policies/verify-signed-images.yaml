apiVersion: policies.kyverno.io/v1alpha1
kind: ImageValidatingPolicy
metadata:
  name: verify-github-release-signatures
spec:
  validationActions:
    - Audit
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
  matchImageReferences:
    - glob: "ghcr.io/saakibsheikh1/slsa-secure-delivery-*:*"
  attestors:
    - name: githubRelease
      cosign:
        keyless:
          identities:
            - issuer: "https://token.actions.githubusercontent.com"
              subject: "https://github.com/saakibsheikh1/slsa-secure-delivery-platform/.github/workflows/release.yml@refs/heads/main"
  validations:
    - expression: >-
        images.containers.map(image,
          verifyImageSignatures(image, [attestors.githubRelease])
        ).all(result, result > 0)
      message: "Image must have a valid Cosign signature from the approved GitHub Actions release workflow."
